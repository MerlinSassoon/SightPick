# 可选：以可编辑方式安装（不安装也可通过 python run.py 运行）
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recruiting-capture"
version = "0.1.0"
description = "智能招聘数据抓取与可视化平台原型（区域框选 + OCR + 视觉大模型）"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "Pillow>=9.0",
    "requests>=2.28",
    "pyautogui>=0.9.54",
    "paddleocr>=3.0,<4",
    "paddlepaddle>=3.0",
    "streamlit>=1.34",
    "streamlit-image-coordinates>=0.4.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
recruiting-capture = "recruiting_capture.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
